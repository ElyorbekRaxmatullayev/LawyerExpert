server {
    listen 80;
    listen [::]:80;
    server_name legalexpert.uz www.legalexpert.uz;

    client_max_body_size 2m;

    access_log /var/log/nginx/legalexpert.access.log;
    error_log  /var/log/nginx/legalexpert.error.log;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /static/ {
        alias /var/www/legalexpert/static/;
        expires 6M;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.ico { alias /var/www/legalexpert/static/favicon.ico; expires 6M; access_log off; }
    location = /robots.txt  { alias /var/www/legalexpert/static/robots.txt; access_log off; }
    location = /sitemap.xml { alias /var/www/legalexpert/static/sitemap.xml; access_log off; }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
